name: Deploy Hadley website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hadley-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --oauth2-bearer "${COOLIFY_TOKEN}" \
            --header "Accept: application/json" \
            "https://coo.imbamarketing.com/api/v1/deploy?uuid=264uq8xuaxbtucqlwafc8qfh&force=true"
